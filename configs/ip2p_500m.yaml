# ==========================================================================
# OFFICIAL InstructPix2Pix clip-filtered dataset, ONE ~500 MB parquet shard.
#
#   data/ip2p_500m/raw/train-00000-of-00262-57cebf95b4a9170c.parquet
#   499,831,414 bytes / 1,195 rows / 512x512 JPEG pairs
#   source: https://huggingface.co/datasets/timbrooks/instructpix2pix-clip-filtered
#
# Format (official triplet -> project batch contract):
#   original_image -> degraded | edited_image -> clean | edit_prompt -> prompt
#
# [FACT] These images were GENERATED by Stable Diffusion + Prompt-to-Prompt
#        (Brooks et al. CVPR 2023), NOT real photographs.
# [FACT] scripts/inspect_ip2p_shard.py measured a_class_native=false:
#        all 1,195 inputs are distinct, so this shard is NOT one-input-many-
#        targets. Do not claim the §8.2 text-necessity result for it.
# [FACT] edit_prompt IS open-ended information absent from the image
#        ("Turn it into a photo", "make her a scientist"), so text is not a
#        deterministic function of the degradation, unlike the old toy data.
#
# "不一定全部训练": ip2p_max_rows caps the subset actually used. The full
# 500 MB shard stays on disk either way.
#
#   D:/Anaconda/envs/ChatAI/python.exe src/train.py \
#       --override configs/ip2p_500m.yaml --device cuda --steps 1200 \
#       --out-dir outputs/checkpoints/ip2p_500m
# ==========================================================================
project:
  seed: 20261107

backend:
  name: toy              # locally runnable; real FLUX.2 needs a fresh Qwen3
                         # cache for these 1,195 new edit_prompts (CPU-slow)

data:
  source: ip2p
  image_size: 64         # toy trunk: patch 8 -> 8x8=64 tokens; source is 512x512
  patch_size: 8
  num_pairs: 800
  cache_dir: "data"
  ip2p_parquet: "data/ip2p_500m/raw/train-00000-of-00262-57cebf95b4a9170c.parquet"
  ip2p_max_rows: 800

train:
  steps: 1200
  batch_size: 1
  lr: 5.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 50
  ckpt_every: 300
  device: auto
  amp: false
  num_timesteps: 50
  t_min: 0.90            # high-noise end, carried over from the verified §8.2 A/B
  t_max: 1.0
  out_dir: "outputs/checkpoints/ip2p_500m"

eval:
  metrics: [psnr, ssim]
  text_response_pairs:
    - ["Turn it into a photo", "Make it a cartoon."]
    - ["make the waterfall a rainbow", "make her a scientist"]
  response_threshold: 0.01
