# ==========================================================================
# A-CLASS view built from the official 499.83 MB InstructPix2Pix shard.
# Build first:
#   D:/Anaconda/envs/ChatAI/python.exe scripts/build_ip2p_multitarget.py --groups 200
#
# ONE official input image -> K=4 different targets; only the text says which.
# Control: configs/ip2p_multitarget_control.yaml (collapse_targets = true).
# ==========================================================================
project:
  seed: 20261107

backend:
  name: toy

data:
  source: multi_target
  image_size: 64
  patch_size: 8
  num_pairs: 200
  cache_dir: "data"
  multi_target_manifest: "data/ip2p_500m/multitarget/train.jsonl"

train:
  steps: 1200
  batch_size: 1
  lr: 5.0e-4
  weight_decay: 0.0
  grad_clip: 1.0
  log_every: 100
  ckpt_every: 400
  device: auto
  amp: false
  num_timesteps: 50
  t_min: 0.90
  t_max: 1.0
  out_dir: "outputs/checkpoints/ip2p_multitarget"

eval:
  metrics: [psnr, ssim]
  text_response_pairs:
    - ["restore in full natural color: remove scratches dust and grain, recover the original colors",
       "keep the original sepia tone: remove scratches dust and grain, preserve the warm brown cast"]
    - ["restore in black and white: remove all aging defects but keep the monochrome look",
       "minimal repair only: remove scratches and dust, keep the aged film grain and color cast"]
  response_threshold: 0.01
